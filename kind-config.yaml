# 第 12 集：本機的 Kubernetes 叢集（kind＝Kubernetes in Docker：每個「節點」是一個 Docker 容器）。
#
#   kind create cluster --config kind-config.yaml     # 建叢集（名字 foodgo；kubectl 的 context 叫 kind-foodgo）
#   kind load docker-image foodgo:0.11.0 --name foodgo  # 把本機建好的映像檔載進叢集（不經過 registry）
#   kind delete cluster --name foodgo                 # 收拾
#
# 只有一個節點：控制平面（API server、etcd、scheduler…）和我們的 Pod 都在這個節點上。
# 多一個 worker 節點要多吃約 0.3～0.5 GB 記憶體，對這一集要看的東西（擴展、自我修復、滾動更新）沒有差別。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: foodgo
nodes:
  - role: control-plane
    # 節點映像檔釘到 kind v0.33.0 預設的那一版（Kubernetes v1.37.0）；digest 也寫上，換了內容就拉不下來
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    # 叢集外（你的瀏覽器、curl）怎麼連進來：本機的埠 → 節點容器的埠（＝Service 的 nodePort）。
    # 叢集建好以後就改不了，要改得刪掉重建。只聽 127.0.0.1：同一個網路的其他電腦連不到。
    extraPortMappings:
      - containerPort: 30080 # Gateway（k8s/apps/gateway.yaml 的 nodePort）
        hostPort: 8000
        listenAddress: 127.0.0.1
      - containerPort: 30686 # Jaeger UI（k8s/infra/jaeger.yaml 的 nodePort）；compose 的 Jaeger 是 16686，兩個可以同時開
        hostPort: 26686
        listenAddress: 127.0.0.1
      - containerPort: 30808 # Kafka UI（要的時候才裝：kubectl apply -k k8s/kafka-ui）；compose 的是 18080
        hostPort: 28080
        listenAddress: 127.0.0.1
