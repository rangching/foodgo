[project]
name = "foodgo"
version = "0.1.0"
description = "好食快送：線上訂餐外送"
readme = "README.md"
authors = [
    { name = "cliff wu", email = "54541999+rangching@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.16.1",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "psycopg[binary]>=3.3.8",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
]

[tool.fastapi]
entrypoint = "foodgo.app:app"
