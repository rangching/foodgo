# Kafka UI（第 4 集）：和 compose.yaml 同一個映像檔；NodePort 30808，kind-config.yaml 接到本機 http://127.0.0.1:28080
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
spec:
  type: NodePort
  selector:
    app: kafka-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30808
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka-ui
          image: kafbat/kafka-ui:v1.5.0
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: foodgo
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka:9092
            - name: JAVA_OPTS
              value: -Xms256m -Xmx384m
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi
