# Secret：資料庫的密碼與連線字串。程式只讀整條 FOODGO_DATABASE_URL（第 4 集起），所以每個服務的連線字串整條放進來，程式不用改。
#
# data 裡的值是 base64「編碼」，不是加密——誰都解得開：
#   kubectl get secret foodgo-db -o jsonpath='{.data.kitchen}' | base64 -d
# 這份是本機練習用的假密碼（foodgo），才敢放進 git。正式環境的密碼不進 git：用 Sealed Secrets、External Secrets、雲端的 Secret Manager。
#
# 這個檔案是這樣做出來的（kubectl 幫你轉 base64）：
#   kubectl create secret generic foodgo-db --dry-run=client -o yaml \
#     --from-literal=POSTGRES_PASSWORD=foodgo \
#     --from-literal=ordering=postgresql://foodgo:foodgo@postgres:5432/foodgo_ordering \
#     --from-literal=payment=postgresql://foodgo:foodgo@postgres:5432/foodgo_payment \
#     --from-literal=kitchen=postgresql://foodgo:foodgo@postgres:5432/foodgo_kitchen \
#     --from-literal=delivery=postgresql://foodgo:foodgo@postgres:5432/foodgo_delivery
apiVersion: v1
kind: Secret
metadata:
  name: foodgo-db
type: Opaque
data:
  POSTGRES_PASSWORD: Zm9vZGdv # foodgo：給 PostgreSQL 自己用（infra/postgres.yaml）
  # 每個服務自己的資料庫：postgresql://foodgo:foodgo@postgres:5432/foodgo_<名字>（Deployment 用 secretKeyRef 拿自己那一條）
  ordering: cG9zdGdyZXNxbDovL2Zvb2Rnbzpmb29kZ29AcG9zdGdyZXM6NTQzMi9mb29kZ29fb3JkZXJpbmc=
  payment: cG9zdGdyZXNxbDovL2Zvb2Rnbzpmb29kZ29AcG9zdGdyZXM6NTQzMi9mb29kZ29fcGF5bWVudA==
  kitchen: cG9zdGdyZXNxbDovL2Zvb2Rnbzpmb29kZ29AcG9zdGdyZXM6NTQzMi9mb29kZ29fa2l0Y2hlbg==
  delivery: cG9zdGdyZXNxbDovL2Zvb2Rnbzpmb29kZ29AcG9zdGdyZXM6NTQzMi9mb29kZ29fZGVsaXZlcnk=
