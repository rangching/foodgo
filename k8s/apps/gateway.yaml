# API Gateway（第 10 集）：對外唯一的入口。沒有資料庫、不碰 Kafka，只有 /healthz（沒有 /readyz）。
# 長得和 kitchen.yaml 一樣（註解看那一份），只差 command、Service 的種類與就緒探針。
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort # 叢集外也連得到：每個節點的 30080 → 這個 Service；kind-config.yaml 再把本機的 8000 接到節點的 30080
  selector:
    app: gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: foodgo
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "foodgo.services.gateway"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: foodgo # FOODGO_ORDERING_URL=http://ordering:8000…
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe: # Gateway 沒有 /readyz：它不需要準備什麼，聽得到就能轉
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
