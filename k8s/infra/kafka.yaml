# Kafka（KRaft 單節點）：和 compose.yaml 同一個映像檔、同一組設定，只是只留叢集裡用的入口 kafka:9092。
# 教學用的最簡版本：一台 broker、副本數 1。正式環境至少三台，或用 operator（例如 Strimzi）、雲端的託管 Kafka。
apiVersion: v1
kind: Service
metadata:
  name: kafka # 服務連 kafka:9092（ConfigMap 的 FOODGO_KAFKA_BOOTSTRAP）
spec:
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data # topic 的訊息存在這裡：Pod 重開，訊息還在
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# StatefulSet：名字固定（kafka-0）、同一時間最多一個（見 infra/postgres.yaml）
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Kubernetes 預設會替每個 Service 塞環境變數：名叫 kafka 的 Service → KAFKA_PORT=tcp://10.96…:9092。
      # Kafka 的映像檔把 KAFKA_ 開頭的環境變數都當成設定，會被這些塞進來的變數弄壞。關掉。
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:4.3.2 # 和 compose.yaml 同一版
          env:
            - name: CLUSTER_ID
              value: Zm9vZGdvLWtyYWZ0LTAwMQ
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            # 只有叢集裡的入口：大家用 Service 的名字 kafka:9092 找它（compose 還有給本機的 19092，這裡不需要）
            - name: KAFKA_LISTENERS
              value: INTERNAL://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: INTERNAL://kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_HEAP_OPTS
              value: -Xms512m -Xmx512m
          ports:
            - name: kafka
              containerPort: 9092
          readinessProbe: # 9092 接得了連線才把流量給它
            tcpSocket:
              port: kafka
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1Gi # JVM：heap 512 MB＋其他；超過就被砍（OOMKilled）
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kafka-data
