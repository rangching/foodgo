# Jaeger（第 10 集）：收 span、畫 trace。資料只放記憶體，Pod 重開就清空——所以用 Deployment 就好。
apiVersion: v1
kind: Service
metadata:
  name: jaeger # 服務把 span 送到 http://jaeger:4318（ConfigMap 的 OTEL_EXPORTER_OTLP_ENDPOINT）
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui # 給瀏覽器看的：NodePort 30686，kind-config.yaml 再接到本機 http://127.0.0.1:26686
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: ui
      nodePort: 30686
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      enableServiceLinks: false
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.23.0 # 和 compose.yaml 同一版
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: ui
              containerPort: 16686
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /status
              port: health
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi # trace 都在記憶體裡，存越多越大
